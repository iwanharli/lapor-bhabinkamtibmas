# /etc/nginx/sites-available/lapor.conf
# Per IP, longgar: satu kantor/operator seluler (NAT) dipakai banyak Bhabin, mis. saat pelatihan.
# Tebakan sandi per akun ditahan backend (per IP + NRP) dan penguncian akun.
limit_req_zone $binary_remote_addr zone=login:10m rate=60r/m;

upstream lapor_api { server 127.0.0.1:3000; keepalive 16; }
upstream lapor_web { server 127.0.0.1:3001; keepalive 16; }

# Jaringan internal yang boleh membuka dashboard & endpoint admin (sesuaikan).
geo $is_internal {
  default        0;
  10.0.0.0/8     1;
  172.16.0.0/12  1;
  192.168.0.0/16 1;
}

server {
  listen 80;
  server_name lapor.example.internal;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name lapor.example.internal;

  ssl_certificate     /etc/ssl/lapor/fullchain.pem;
  ssl_certificate_key /etc/ssl/lapor/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;

  client_max_body_size 30m;

  # Kompres JSON/RSC/aset: respons analitik nasional bisa ratusan KB (mis. sebaran harga ribuan desa).
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  gzip_types application/json text/x-component text/css application/javascript text/plain image/svg+xml;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;
  proxy_http_version 1.1;
  proxy_set_header Connection "";

  location = /api/v1/auth/login {
    limit_req zone=login burst=30 nodelay;
    proxy_pass http://lapor_api;
  }

  location ~ ^/api/(docs|v1/admin|v1/audit-logs) {
    if ($is_internal = 0) { return 403; }
    proxy_pass http://lapor_api;
  }

  location /api/v1/ { proxy_pass http://lapor_api; }

  # Dashboard hanya dari jaringan internal.
  location / {
    if ($is_internal = 0) { return 403; }
    proxy_pass http://lapor_web;
  }
}
